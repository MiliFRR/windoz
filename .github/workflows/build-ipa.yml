name: Build windoz IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: IPA (macOS, unsigned)
    runs-on: macos-26
    timeout-minutes: 350
    env:
      LLVM_COMMIT: 8dfdcc7b7bf66834a761bd8de445840ef68e4d1a
    steps:
      - name: Check out windoz + Madeira + runtime forks
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode
        run: |
          set -e
          ls /Applications | grep -i xcode || true
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK_PATH"
          case "$SDK_PATH" in
            *iPhoneOS26*|*iPhoneOS27*) echo "iOS 26+ SDK OK" ;;
            *)
              echo "::error::This image has no iOS 26+ SDK (got: $SDK_PATH)."
              echo "::error::windoz needs Xcode 26+ — switch runs-on or wait for image updates."
              exit 1
              ;;
          esac

      - name: Install build tools
        run: |
          set -e
          brew install cmake ninja meson bison sevenzip ccache
          command -v rustup >/dev/null 2>&1 || brew install rustup
          rustup target add aarch64-apple-ios || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Verify the signing entitlements
        # Cheap and early: a stale app-windoz/Config/Windoz.entitlements should
        # fail here, not after the runtime chain.
        run: ./scripts/generate-entitlements.sh --check

      - name: Restore LLVM cache
        id: llvmcache
        uses: actions/cache/restore@v4
        with:
          path: |
            madeira/toolchains/llvm-project
            madeira/toolchains/llvm-host-build
            madeira/toolchains/llvm-ios-build
          # v4: the v3 entry was written by the "Save LLVM cache (even on later
          # failures)" step of a run that was CANCELLED mid-build, so it holds a
          # partial llvm-ios-build/lib (no libLLVMPasses.a — the app link failed
          # on exactly the symbols that archive defines). v4 starts a fresh entry;
          # the restore-key fallback still lets that v3 tree be completed
          # incrementally instead of rebuilt from zero.
          key: llvm-${{ env.LLVM_COMMIT }}-v4
          restore-keys: |
            llvm-${{ env.LLVM_COMMIT }}-

      - name: Build LLVM for iOS
        # Always run, even on a cache hit. build-llvm.sh is idempotent and ends in
        # `cmake --build` (ninja), so a complete tree costs seconds, while a tree
        # restored from a cache entry that a cancelled run wrote gets finished
        # here — instead of surfacing much later as a missing archive.
        run: ./scripts/build-llvm.sh

      - name: Save LLVM cache (even on later failures)
        if: always() && steps.llvmcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            madeira/toolchains/llvm-project
            madeira/toolchains/llvm-host-build
            madeira/toolchains/llvm-ios-build
          key: llvm-${{ env.LLVM_COMMIT }}-v4

      - name: Fetch llvm-mingw toolchain
        run: ./scripts/fetch-llvm-mingw.sh

      - name: Fetch VC++ x64 runtime DLLs
        run: ./scripts/fetch-vcruntime.sh

      - name: Build runtime (Wine / FEX / DXMT / D3D12)
        run: ./scripts/build-runtime.sh

      - name: Build app (Debug, unsigned)
        run: ./scripts/build-windoz-app.sh

      - name: Assemble IPA
        run: ./scripts/assemble-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: windoz-unsigned-ipa
          path: windoz.ipa
          if-no-files-found: error
          retention-days: 14
